<!DOCTYPE html>
<html>
<head>
    <title>Tetris</title>
    <style>
        body {
            background: #202028;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.2em;
            text-align: center;
        }
        canvas {
            border: solid .2em #fff;
            height: 80vh; 
            background: #000;
        }
        #game-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px; /* Aumentei o espaço para melhor visualização */
        }
        #info {
            text-align: left;
            width: 150px;
        }
        #score {
            font-weight: bold;
            font-size: 1.2em;
            color: #feda4a; /* Cor de destaque para a pontuação */
        }
    </style>
</head>
<body>
    <h1>Tetris</h1>
    <div id="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        <div id="info">
            <p id="score">Pontuação: 0</p>
            <p><strong>Controles:</strong></p>
            <p>&larr; &rarr; Mover</p>
            <p>&darr; Acelerar</p>
            <p>&uarr; Girar</p>
        </div>
    </div>

    <script>
        // --- Setup do Jogo ---
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        
        const ROWS = 20;
        const COLS = 12;
        const BLOCK_SIZE = 20;

        context.scale(BLOCK_SIZE, BLOCK_SIZE);

        let score = 0;
        
        // --- Peças (Tetrominós) ---
        const PIECES = [
            {
                shape: [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0]
                ],
                color: '#FF0D72' // I
            },
            {
                shape: [
                    [2, 0, 0],
                    [2, 2, 2],
                    [0, 0, 0]
                ],
                color: '#0DC2FF' // J
            },
            {
                shape: [
                    [0, 0, 3],
                    [3, 3, 3],
                    [0, 0, 0]
                ],
                color: '#0DFF72' // L
            },
            {
                shape: [
                    [4, 4],
                    [4, 4]
                ],
                color: '#F538FF' // O
            },
            {
                shape: [
                    [0, 5, 5],
                    [5, 5, 0],
                    [0, 0, 0]
                ],
                color: '#FF8E0D' // S
            },
            {
                shape: [
                    [0, 6, 0],
                    [6, 6, 6],
                    [0, 0, 0]
                ],
                color: '#FFE138' // T
            },
            {
                shape: [
                    [7, 7, 0],
                    [0, 7, 7],
                    [0, 0, 0]
                ],
                color: '#3877FF' // Z
            }
        ];

        // --- Tabuleiro e Jogador ---
        let board = createBoard();
        let player = {
            pos: { x: 0, y: 0 },
            piece: null,
        };

        function createBoard() {
            return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        }

        function createRandomPiece() {
            const randIndex = Math.floor(Math.random() * PIECES.length);
            return PIECES[randIndex];
        }

        // --- Funções de Desenho ---
        function draw() {
            // Limpa o canvas com fundo preto
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(board, { x: 0, y: 0 }); // Desenha as peças que já caíram
            drawMatrix(player.piece.shape, player.pos, player.piece.color); // Desenha a peça atual
        }

        function drawMatrix(matrix, offset, color) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = color || PIECES[value - 1].color;
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }
        
        // --- Lógica de Colisão e Movimento ---
        function merge() {
            player.piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        board[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function checkCollision() {
            const { shape, color } = player.piece;
            const { x: px, y: py } = player.pos;

            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x] !== 0) {
                        let newY = y + py;
                        let newX = x + px;
                        if (newY >= ROWS || newX < 0 || newX >= COLS || board[newY] && board[newY][newX] !== 0) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }
        
        function playerDrop() {
            player.pos.y++;
            if (checkCollision()) {
                player.pos.y--;
                merge();
                playerReset();
                sweepLines();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (checkCollision()) {
                player.pos.x -= dir;
            }
        }
        
        function playerRotate() {
            const originalPiece = JSON.parse(JSON.stringify(player.piece.shape));
            const rotated = player.piece.shape[0].map((_, colIndex) => player.piece.shape.map(row => row[colIndex]).reverse());
            player.piece.shape = rotated;
            if (checkCollision()) {
                player.piece.shape = originalPiece; // Reverte se a rotação causar colisão
            }
        }

        // --- Loop do Jogo ---
        let dropCounter = 0;
        let dropInterval = 1000; // 1 segundo
        let lastTime = 0;

        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }
            
            draw();
            requestAnimationFrame(update);
        }

        // --- Funções de Controle do Jogo ---
        function playerReset() {
            player.piece = createRandomPiece();
            player.pos.x = Math.floor(COLS / 2) - Math.floor(player.piece.shape[0].length / 2);
            player.pos.y = 0;

            if (checkCollision()) {
                board = createBoard();
                score = 0;
                updateScore();
                alert("Fim de Jogo!");
            }
        }
        
        function sweepLines() {
            let clearedLines = 0;
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(value => value > 0)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    clearedLines++;
                    y++; // Re-verifica a mesma linha
                }
            }
            if (clearedLines > 0) {
                score += clearedLines * 10 * clearedLines; // Pontuação exponencial
                updateScore();
            }
        }

        function updateScore() {
            scoreElement.innerText = `Pontuação: ${score}`;
        }

        // --- Controles ---
        document.addEventListener('keydown', event => {
            if (event.key === 'ArrowLeft') {
                playerMove(-1);
            } else if (event.key === 'ArrowRight') {
                playerMove(1);
            } else if (event.key === 'ArrowDown') {
                playerDrop();
            } else if (event.key === 'ArrowUp') {
                playerRotate();
            }
        });

        // --- Iniciar o Jogo ---
        playerReset();
        updateScore();
        update();

    </script>
</body>
</html>
