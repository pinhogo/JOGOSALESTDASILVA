<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>JOGOS ALEST DA SILVA - Arcade</title>
    <meta name="description" content="Coleção de jogos divertidos e interativos">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #1a1f3a;
            --bg-card: #252b48;
            --accent-primary: #00d9ff;
            --accent-secondary: #7b2cbf;
            --accent-hover: #00f0ff;
            --text-primary: #ffffff;
            --text-secondary: #b8c5d6;
            --shadow: rgba(0, 217, 255, 0.2);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background effect */
        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(123, 44, 191, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 217, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 2px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        .game-card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            animation: fadeInUp 0.6s ease-out;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 0;
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent-primary);
            box-shadow: 0 20px 60px var(--shadow);
        }

        .game-card:hover::before {
            opacity: 0.1;
        }

        .game-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, #1a1f3a 0%, #252b48 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: var(--accent-primary);
        }

        .game-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            padding: 25px;
            position: relative;
            z-index: 1;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-description {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .game-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .stat i {
            color: var(--accent-primary);
        }

        .play-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.3);
        }

        .play-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 217, 255, 0.5);
            background: linear-gradient(135deg, var(--accent-hover), var(--accent-secondary));
        }

        .play-button i {
            margin-right: 10px;
        }

        footer {
            text-align: center;
            margin-top: 80px;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            h1 {
                letter-spacing: 2px;
            }

            .game-stats {
                gap: 15px;
            }
        }

        /* Badge for new games */
        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #ff006e, #8338ec);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
            box-shadow: 0 5px 15px rgba(255, 0, 110, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 JOGOS ALEST DA SILVA</h1>
            <p class="subtitle">Arcade de Jogos Interativos</p>
        </header>

        <div class="games-grid">
            <!-- Game Card: Mira Bamba -->
            <div class="game-card" onclick="window.location.href='src/htmlgames/Mira_Bamba.html'">
                <span class="badge">Novo</span>
                <div class="game-image">
                    <!-- Você pode substituir o ícone pela sua própria imagem -->
                    <!-- <img src="caminho/para/sua/imagem.jpg" alt="Mira Bamba"> -->
                    <i class="fas fa-crosshairs"></i>
                </div>
                <div class="game-info">
                    <h2 class="game-title">Mira Bamba</h2>
                    <p class="game-description">
                        Teste sua precisão e reflexos neste jogo de mira desafiador. 
                        Acerte os alvos e alcance a maior pontuação!
                    </p>
                    <div class="game-stats">
                        <span class="stat">
                            <i class="fas fa-gamepad"></i>
                            Ação
                        </span>
                        <span class="stat">
                            <i class="fas fa-clock"></i>
                            Rápido
                        </span>
                        <span class="stat">
                            <i class="fas fa-star"></i>
                            Popular
                        </span>
                    </div>
                    <button class="play-button">
                        <i class="fas fa-play"></i>
                        Jogar Agora
                    </button>
                </div>
            </div>

            <!-- Adicione mais jogos aqui seguindo o mesmo padrão -->

                <span class="badge">Novo</span>
                <div class="game-image">
                    <img src="caminho/para/imagem.jpg" alt="Nome do Jogo">
                </div>
                <div class="game-info">
                    <h2 class="game-title">Nome do Jogo</h2>
                    <p class="game-description">
                        Descrição do seu jogo aqui.
                    </p>
                    <div class="game-stats">
                        <span class="stat">
                            <i class="fas fa-gamepad"></i>
                            Categoria
                        </span>
                        <span class="stat">
                            <i class="fas fa-users"></i>
                            Multiplayer
                        </span>
                    </div>
                    <button class="play-button">
                        <i class="fas fa-play"></i>
                        Jogar Agora
                    </button>
                </div>
            </div>
            -->

        </div>

        <footer>
            <p>© 2025 JOGOS ALEST DA SILVA - Todos os direitos reservados</p>
            <p style="margin-top: 10px; opacity: 0.7;">
                <i class="fas fa-code"></i> Feito com 💜 para diversão
            </p>
        </footer>
    </div>

    <script>
        // Animação sequencial dos cards
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.game-card');
            cards.forEach((card, index) => {
                card.style.animationDelay = `${index * 0.1}s`;
            });
        });

        // Previne o comportamento padrão do botão dentro do card clicável
        document.querySelectorAll('.play-button').forEach(button => {
            button.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        });
    </script>
</body>
</html>
